name: Build Unsigned IPA
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install xtool
        run: brew install xtool-org/tap/xtool
      - name: Build iOS App
        run: |
          if [ -f "swift/UbuntuQEMU/xtool.yml" ]; then
            cd swift/UbuntuQEMU
          fi
          xtool build -c release || swift build -c release --triple arm64-apple-ios
          mkdir -p "$GITHUB_WORKSPACE/build/Payload"
          find . -name "*.app" -maxdepth 4 -exec cp -R {} "$GITHUB_WORKSPACE/build/Payload/" \;
      - name: Package IPA
        run: |
          cd "$GITHUB_WORKSPACE/build"
          if ls Payload/*.app 1> /dev/null 2>&1; then
            zip -r ../Qemu-iOS-Ubuntu.ipa Payload
          else
            echo "Nenhum bundle .app encontrado em Payload"
            find "$GITHUB_WORKSPACE" -maxdepth 4
            exit 1
          fi
      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Qemu-iOS-Ubuntu-IPA
          path: Qemu-iOS-Ubuntu.ipa
