name: Build Unsigned IPA
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build iOS Binary
        run: |
          IOS_SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          swift build -c release \
            --product QemuIOSUbuntu \
            --triple arm64-apple-ios17.0 \
            --sdk "$IOS_SDK" \
            -Xcc -isysroot -Xcc "$IOS_SDK" \
            -Xswiftc -sdk -Xswiftc "$IOS_SDK" \
            -Xswiftc -target -Xswiftc arm64-apple-ios17.0
      - name: Package IPA
        run: |
          APP_DIR="$GITHUB_WORKSPACE/build/Payload/QemuIOSUbuntu.app"
          mkdir -p "$APP_DIR"

          BIN_PATH=".build/arm64-apple-ios/release/QemuIOSUbuntu"
          if [ ! -f "$BIN_PATH" ]; then
            echo "Binário não encontrado em $BIN_PATH"
            ls -la .build/arm64-apple-ios/release
            exit 1
          fi
          cp "$BIN_PATH" "$APP_DIR/QemuIOSUbuntu"
          chmod +x "$APP_DIR/QemuIOSUbuntu"

          cp Config/Info.plist "$APP_DIR/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleExecutable QemuIOSUbuntu" "$APP_DIR/Info.plist" || \
            /usr/libexec/PlistBuddy -c "Add :CFBundleExecutable string QemuIOSUbuntu" "$APP_DIR/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundlePackageType APPL" "$APP_DIR/Info.plist" || \
            /usr/libexec/PlistBuddy -c "Add :CFBundlePackageType string APPL" "$APP_DIR/Info.plist"

          find .build/arm64-apple-ios/release -maxdepth 1 -name "*.bundle" -exec cp -R {} "$APP_DIR/" \;

          cd "$GITHUB_WORKSPACE/build"
          zip -r ../Qemu-iOS-Ubuntu.ipa Payload
      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Qemu-iOS-Ubuntu-IPA
          path: Qemu-iOS-Ubuntu.ipa
