name: Build Unsigned IPA
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build iOS App
        run: |
          mkdir -p build/Payload
          if ls *.xcodeproj 1> /dev/null 2>&1; then
            xcodebuild -scheme "$(xcodebuild -list -json | jq -r '.project.schemes[0]')" \
              -sdk iphoneos -configuration Release \
              CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO \
              CONFIGURATION_BUILD_DIR="$PWD/build/Payload"
          else
            brew install xtool-org/tap/xtool || true
            swift build -c release --triple arm64-apple-ios
          fi
      - name: Package IPA
        run: |
          cd build
          if [ -d Payload/*.app ]; then
            zip -r ../Qemu-iOS-Ubuntu.ipa Payload
          fi
      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Qemu-iOS-Ubuntu-IPA
          path: Qemu-iOS-Ubuntu.ipa
